---
# =============================================================================
# scap_remediate_from_arf.yml
# Definitive SCAP remediation — downloads ARF from Satellite, extracts
# Ansible fix snippets, classifies by tags, applies safe fixes, stages
# reboot fixes, triggers rescan → automated closed loop.
# =============================================================================
- name: SCAP remediation from Satellite ARF report content
  hosts: localhost
  gather_facts: true
  vars:
    satellite_url: "https://satellite.v2wlb.sandbox5527.opentlc.com"
    satellite_user: "admin"
    satellite_password: "changeme"
    report_id: ""
    host_name: ""
    policy_name: "CIS_RHEL8_BSC_Tailored"
    auto_rescan: true
    dry_run: false
    arf_staging_dir: "/tmp/scap-arf"
    remediation_staging_dir: "/var/lib/scap-remediation"
    global_manual_review_rules:
      - sshd_disable_root_login
      - disable_ctrlaltdel_reboot
      - network_sniffer_disabled
      - package_telnet_removed
      - package_rsh_removed
      - package_tftp_removed
    excluded_rules: []
    customer_manual_review_rules: []
    minimum_severity: "medium"
    severity_order:
      low: 1
      medium: 2
      high: 3
      critical: 4

  tasks:

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ arf_staging_dir }}"
        - "{{ remediation_staging_dir }}"

    - name: Get latest ARF report if no report_id provided
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports?per_page=1&order=reported+DESC"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: latest_report
      when: report_id | string | length == 0

    - name: Set facts from latest report
      ansible.builtin.set_fact:
        report_id: "{{ latest_report.json.results[0].id }}"
        host_name: "{{ latest_report.json.results[0].host.name }}"
        policy_name: "{{ latest_report.json.results[0].policy.name }}"
        failed_count: "{{ latest_report.json.results[0].failed }}"
        passed_count: "{{ latest_report.json.results[0].passed }}"
      when:
        - report_id | string | length == 0
        - latest_report.json.results | length > 0

    - name: Get specific ARF report metadata
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ report_id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: arf_meta
      when: report_id | string | length > 0

    - name: Set facts from specific report
      ansible.builtin.set_fact:
        host_name: "{{ arf_meta.json.host.name | default(host_name) }}"
        policy_name: "{{ arf_meta.json.policy.name | default(policy_name) }}"
        failed_count: "{{ arf_meta.json.failed | default(0) }}"
        passed_count: "{{ arf_meta.json.passed | default(0) }}"
      when: arf_meta is not skipped

    - name: Fail if host_name not set
      ansible.builtin.fail:
        msg: "host_name is required — pass from triage webhook or ARF report"
      when: host_name | default('') | length == 0

    - name: Show report details
      ansible.builtin.debug:
        msg:
          - "Report ID: {{ report_id }}"
          - "Host:      {{ host_name }}"
          - "Policy:    {{ policy_name }}"
          - "Passed:    {{ passed_count | default('?') }}"
          - "Failed:    {{ failed_count | default('?') }}"

    - name: Merge manual review rules
      ansible.builtin.set_fact:
        all_manual_review_rules: >-
          {{ global_manual_review_rules +
             (customer_manual_review_rules | default([])) }}

    - name: Download bzipped ARF report from Satellite
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ report_id }}/download"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        dest: "{{ arf_staging_dir }}/arf-{{ report_id }}.xml.bz2"
        return_content: false
        status_code: [200]

    - name: Decompress ARF report
      ansible.builtin.command: >
        bunzip2 -f {{ arf_staging_dir }}/arf-{{ report_id }}.xml.bz2

    - name: Verify ARF XML exists
      ansible.builtin.stat:
        path: "{{ arf_staging_dir }}/arf-{{ report_id }}.xml"
      register: arf_stat

    - name: Fail if ARF not downloaded
      ansible.builtin.fail:
        msg: "ARF download failed — check Satellite connectivity"
      when: not arf_stat.stat.exists

    - name: Extract and classify Ansible fix snippets from ARF
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET
        import json
        import re

        arf_file = '{{ arf_staging_dir }}/arf-{{ report_id }}.xml'
        excluded = {{ excluded_rules | default([]) | to_json }}
        manual_rules = {{ all_manual_review_rules | to_json }}
        min_severity = '{{ minimum_severity }}'
        severity_order = {{ severity_order | to_json }}
        min_sev_val = severity_order.get(min_severity, 2)

        tree = ET.parse(arf_file)
        root = tree.getroot()

        rule_fixes = {}
        for rule in root.iter('{http://checklists.nist.gov/xccdf/1.2}Rule'):
            rule_id = rule.get('id', '')
            for fix in rule.findall('{http://checklists.nist.gov/xccdf/1.2}fix'):
                if 'ansible' in fix.get('system', '').lower():
                    fix_text = fix.text or ''
                    tags = re.findall(r'  - (\S+)', fix_text)
                    severity = next((t.replace('_severity','')
                                    for t in tags if '_severity' in t), 'unknown')
                    rule_fixes[rule_id] = {
                        'content': fix_text,
                        'tags': tags,
                        'needs_reboot': 'no_reboot_needed' not in tags,
                        'severity': severity,
                        'short_id': rule_id.split('content_rule_')[-1],
                        'disruption': next((t.replace('_disruption','')
                                           for t in tags if '_disruption' in t), 'unknown')
                    }

        safe_fixes = []
        reboot_fixes = []
        manual_fixes = []
        no_fix = []

        for rr in root.iter('{http://checklists.nist.gov/xccdf/1.2}rule-result'):
            result_el = rr.find('{http://checklists.nist.gov/xccdf/1.2}result')
            if result_el is None or result_el.text != 'fail':
                continue
            rule_id = rr.get('idref', '')
            short_id = rule_id.split('content_rule_')[-1]

            if any(e in short_id for e in excluded):
                continue
            if rule_id not in rule_fixes:
                no_fix.append(short_id)
                continue

            fix = dict(rule_fixes[rule_id])
            fix['rule_id'] = rule_id
            fix['short_id'] = short_id
            sev_val = severity_order.get(fix['severity'], 0)

            if sev_val < min_sev_val and fix['severity'] != 'unknown':
                continue
            if any(m in short_id for m in manual_rules):
                manual_fixes.append(fix)
                continue
            if fix['needs_reboot']:
                reboot_fixes.append(fix)
            else:
                safe_fixes.append(fix)

        safe_pb = '{{ arf_staging_dir }}/safe-{{ report_id }}.yml'
        with open(safe_pb, 'w') as f:
            f.write("---\n")
            f.write("# Safe SCAP remediations | Report: {{ report_id }} | Host: {{ host_name }}\n")
            f.write("- name: SCAP safe remediations (no reboot required)\n")
            f.write("  hosts: all\n")
            f.write("  become: true\n")
            f.write("  tasks:\n")
            for fix in safe_fixes:
                f.write(f"    # {fix['short_id']} | {fix['severity']} | {fix['disruption']}\n")
                for line in fix['content'].strip().split('\n'):
                    if line.strip():
                        f.write(f"    {line}\n")
                f.write("\n")

        reboot_pb = '{{ remediation_staging_dir }}/reboot-{{ report_id }}.yml'
        with open(reboot_pb, 'w') as f:
            f.write("---\n")
            f.write("# Reboot-required SCAP remediations | Report: {{ report_id }}\n")
            f.write("# Apply during maintenance window then reboot\n")
            f.write("- name: SCAP reboot-required remediations\n")
            f.write("  hosts: all\n")
            f.write("  become: true\n")
            f.write("  tasks:\n")
            for fix in reboot_fixes:
                f.write(f"    # {fix['short_id']} | {fix['severity']}\n")
                for line in fix['content'].strip().split('\n'):
                    if line.strip():
                        f.write(f"    {line}\n")
                f.write("\n")

        print(json.dumps({
            'safe_count': len(safe_fixes),
            'reboot_count': len(reboot_fixes),
            'manual_count': len(manual_fixes),
            'no_fix_count': len(no_fix),
            'safe_rules': [f['short_id'] for f in safe_fixes],
            'reboot_rules': [f['short_id'] for f in reboot_fixes],
            'manual_rules': [f['short_id'] for f in manual_fixes],
            'safe_playbook': safe_pb,
            'reboot_playbook': reboot_pb
        }))
        PYEOF
      register: parse_result
      args:
        executable: /bin/bash

    - name: Set triage facts
      ansible.builtin.set_fact:
        triage: "{{ parse_result.stdout | from_json }}"

    - name: Triage summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "SCAP Remediation Triage"
          - "Host:          {{ host_name }}"
          - "Policy:        {{ policy_name }}"
          - "Safe now:      {{ triage.safe_count }}"
          - "Reboot window: {{ triage.reboot_count }}"
          - "Manual review: {{ triage.manual_count }}"
          - "No fix avail:  {{ triage.no_fix_count }}"
          - "Dry run:       {{ dry_run }}"
          - "========================================"

    - name: Apply safe remediations from AAP controller to node
      ansible.builtin.command: >
        ansible-playbook
        -i "{{ host_name }},"
        -u ec2-user
        --become
        -e "ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
        {{ triage.safe_playbook }}
      environment:
        ANSIBLE_COLLECTIONS_PATH: "/usr/share/rhc-worker-playbook/ansible/collections/ansible_collections/"
        ANSIBLE_HOST_KEY_CHECKING: "False"
      register: safe_result
      ignore_errors: true
      when:
        - triage.safe_count | int > 0
        - not dry_run | bool

    - name: Show safe remediation result
      ansible.builtin.debug:
        msg: "{{ safe_result.stdout_lines[-15:] | default(['No output']) }}"
      when:
        - safe_result is not skipped
        - safe_result.stdout_lines is defined

    - name: Log dry run
      ansible.builtin.debug:
        msg:
          - "DRY RUN — playbook NOT applied"
          - "Review: {{ triage.safe_playbook }}"
      when: dry_run | bool

    - name: Stage reboot playbook for maintenance window
      ansible.builtin.copy:
        src: "{{ triage.reboot_playbook }}"
        dest: "{{ remediation_staging_dir }}/reboot-{{ report_id }}.yml"
        mode: '0640'
      when: triage.reboot_count | int > 0
      ignore_errors: true

    - name: Notify reboot-required rules
      ansible.builtin.debug:
        msg:
          - "REBOOT REQUIRED: {{ triage.reboot_count }} rules"
          - "Staged: {{ triage.reboot_playbook }}"
          - "Rules: {{ triage.reboot_rules }}"
          - "Apply during next maintenance window then reboot"
      when: triage.reboot_count | int > 0

    - name: Trigger rescan via Satellite REX
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/v2/job_invocations"
        method: POST
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          job_invocation:
            inputs:
              policy_name: "{{ policy_name }}"
            targeting_type: static_query
            targets:
              - "{{ host_name }}"
        status_code: [201]
      register: rescan_job
      when:
        - auto_rescan | bool
        - not dry_run | bool
        - triage.safe_count | int > 0
      ignore_errors: true

    - name: Show rescan job details
      ansible.builtin.debug:
        msg:
          - "Rescan triggered — Job ID: {{ rescan_job.json.id | default('N/A') }}"
          - "Satellite will scan → webhook fires → triage runs again"
          - "Loop continues until all safe rules pass"
      when:
        - rescan_job is not skipped
        - rescan_job is not failed

    - name: Remediation complete
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Remediation Complete"
          - "Host:          {{ host_name }}"
          - "Safe applied:  {{ triage.safe_count if not dry_run else 'skipped (dry run)' }}"
          - "Reboot staged: {{ triage.reboot_count }}"
          - "Manual review: {{ triage.manual_count }}"
          - "Rescan:        {{ 'triggered — webhook loop active' if auto_rescan and not dry_run else 'skipped' }}"
          - "========================================"
