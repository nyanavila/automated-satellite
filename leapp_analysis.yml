---
- name: Leapp Pre-Upgrade Analysis (RHEL 7.9 to 8.10)
  hosts: "{{ dynamic_inventory_group | default('node4.example.com,node5.example.com,node6.example.com') }}"
  strategy: ansible.builtin.free
  gather_facts: true
  become: true
  force_handlers: true

  vars:
    dynamic_inventory_group: "node4.example.com,node5.example.com,node6.example.com"
    leapp_release: "8.10"
    leapp_target_release: "8.10"
    LEAPP_UNSUPPORTED: "1"
    leapp_unsupported: true
    leapp_include_delay: false

  pre_tasks:
    - name: "PRE-FLIGHT: Stop kdump and free /boot space"
      ansible.builtin.shell: |
        systemctl stop kdump 2>/dev/null || true
        systemctl disable kdump 2>/dev/null || true
        rm -f /boot/*kdump.img /boot/*rescue*
      changed_when: false

    - name: "PRE-FLIGHT: Unload deprecated kernel modules (RHEL 7)"
      ansible.builtin.shell: |
        rmmod pata_acpi 2>/dev/null || true
      when: ansible_distribution_major_version | int == 7
      changed_when: false

    - name: Register output of 'yum repolist'
      ansible.builtin.shell: |
        set -o pipefail
        yum repolist
      args:
        executable: /bin/bash
      register: yum_repolist
      changed_when: yum_repolist.rc != 0

    - name: Set fact for RHUI RHEL extras repo name when EC2 and utilizing RHUI
      ansible.builtin.set_fact:
        analysis_repos_el7: "rhel-7-server-rhui-extras-rpms"
      when:
        - ansible_system_vendor in ["Amazon EC2", "Xen"]
        - ansible_product_uuid | regex_search('^ec2|^EC2')
        - "'rhui' in yum_repolist.stdout"
        - ansible_distribution_major_version | int == 7

  tasks:
    - name: Execute Leapp Analysis Role
      ansible.builtin.include_role:
        name: infra.leapp.analysis
...
