---
- name: Remediate
  hosts: "{{ dynamic_inventory_group | default(omit) }}"
  strategy: ansible.builtin.free
  gather_facts: true
  become: true
  force_handlers: true
  vars:
    leapp_include_delay: false

  tasks:
    - name: Include randomized delay before beginning remediation
      ansible.builtin.command: |
        python3 -c 'import time;import random;zzzzz=random.uniform(15.0,60.0);time.sleep(zzzzz);print(zzzzz)'
      delegate_to: localhost
      connection: local
      when: leapp_include_delay

    # RHEL 7 -> RHEL 8 Remediation
    - name: "Remediate RHEL 7 systems preparing for RHEL 8 upgrade"
      ansible.builtin.include_tasks: remediate_rhel7.yml
      when: ansible_distribution_major_version | int == 7

    # RHEL 8 -> RHEL 9 Remediation
    - name: "Remediate RHEL 8 systems preparing for RHEL 9 upgrade"
      ansible.builtin.include_tasks: remediate_rhel8.yml
      when: ansible_distribution_major_version | int == 8

  handlers:
    - name: "Restart sshd"
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: "Restart firewalld"
      ansible.builtin.service:
        name: firewalld
        state: restarted
...
