---
# =============================================================================
# playbooks/triage/scap_triage_remediate.yml
#
# Core triage engine — triggered by EDA or Satellite webhook via AAP.
# Pulls the ARF report, classifies each failing rule into one of four
# buckets, and dispatches to the correct pipeline job template.
#
# Pipelines dispatched:
#   Pipeline 1 — safe rules   → SCAP / 02 Safe Remediation (immediate)
#   Pipeline 2 — reboot rules → SCAP / 02 Reboot Remediation (scheduled)
#   Pipeline 4 — manual rules → SCAP / 04 Manual Review (notification)
#
# Required vars (from EDA event or AAP survey):
#   report_id, host_name, policy_name, failed_count
# =============================================================================
- name: SCAP triage classify and route to correct pipeline
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../vars/reboot_required_rules.yml
    - ../../vars/manual_review_rules.yml
  vars:
    satellite_url: "https://satellite.v2wlb.sandbox5527.opentlc.com"
    satellite_user: "admin"
    satellite_password: "{{ vault_satellite_password }}"
    aap_url: "https://ansible-1.v2wlb.sandbox5527.opentlc.com"
    aap_token: "{{ vault_aap_token }}"

  tasks:

    - name: Pull ARF report from Satellite API
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ report_id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: arf_report

    - name: Extract all failing rules
      ansible.builtin.set_fact:
        all_failing: >-
          {{ arf_report.json.logs |
             selectattr('result', 'equalto', 'fail') | list }}

    - name: Classify safe bucket no reboot needed
      ansible.builtin.set_fact:
        safe_rules: >-
          {{ all_failing |
             selectattr('source.rule_id', 'defined') |
             rejectattr('source.rule_id', 'in',
               reboot_required_rules + manual_review_rules) | list }}

    - name: Classify reboot bucket maintenance window required
      ansible.builtin.set_fact:
        reboot_rules: >-
          {{ all_failing |
             selectattr('source.rule_id', 'defined') |
             selectattr('source.rule_id', 'in', reboot_required_rules) | list }}

    - name: Classify manual review bucket human approval required
      ansible.builtin.set_fact:
        manual_rules: >-
          {{ all_failing |
             selectattr('source.rule_id', 'defined') |
             selectattr('source.rule_id', 'in', manual_review_rules) | list }}

    - name: Triage classification summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "SCAP Triage Summary"
          - "Host:           {{ host_name }}"
          - "Policy:         {{ policy_name }}"
          - "Total failing:  {{ all_failing | length }}"
          - "Safe fix now:   {{ safe_rules | length }} rules"
          - "Reboot needed:  {{ reboot_rules | length }} rules"
          - "Manual review:  {{ manual_rules | length }} rules"
          - "Reboot rules:   {{ reboot_rules | map(attribute='source.rule_id') | list }}"
          - "========================================"

    - name: Launch Pipeline 1 safe remediation
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/v2/job_templates/SCAP - 02 Safe Remediation/launch/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          limit: "{{ host_name }}"
          extra_vars:
            target_rules: "{{ safe_rules | map(attribute='source.rule_id') | list }}"
            policy_name: "{{ policy_name }}"
            satellite_url: "{{ satellite_url }}"
            auto_rescan: true
        validate_certs: false
        status_code: [201]
      register: safe_job
      when: safe_rules | length > 0

    - name: Schedule Pipeline 2 reboot remediation for maintenance window
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/v2/job_templates/SCAP - 02 Reboot Remediation/schedules/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "SCAP reboot {{ host_name }} {{ policy_name }}"
          rrule: "DTSTART;TZID=UTC:20260615T020000 RRULE:FREQ=WEEKLY;BYDAY=SU;COUNT=1"
          extra_data:
            limit: "{{ host_name }}"
            target_rules: "{{ reboot_rules | map(attribute='source.rule_id') | list }}"
            reboot_required: true
            policy_name: "{{ policy_name }}"
        validate_certs: false
        status_code: [201]
      register: reboot_schedule
      when: reboot_rules | length > 0

    - name: Launch Pipeline 4 manual review notification
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/v2/job_templates/SCAP - 04 Manual Review/launch/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          limit: "{{ host_name }}"
          extra_vars:
            manual_rules: "{{ manual_rules }}"
            policy_name: "{{ policy_name }}"
            host_name: "{{ host_name }}"
            report_id: "{{ report_id }}"
        validate_certs: false
        status_code: [201]
      when: manual_rules | length > 0

    - name: Dispatch complete summary
      ansible.builtin.debug:
        msg:
          - "Pipeline 1 (safe):   {{ safe_job.json.id | default('not triggered') }}"
          - "Pipeline 2 (reboot): {{ 'scheduled for maintenance window' if reboot_rules | length > 0 else 'not triggered' }}"
          - "Pipeline 4 (manual): {{ 'notifications sent' if manual_rules | length > 0 else 'not triggered' }}"
