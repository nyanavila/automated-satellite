---
- name: Leapp OS Upgrade Execution (RHEL 7.9 to 8.10)
  hosts: "{{ dynamic_inventory_group | default('node4.example.com,node5.example.com,node6.example.com') }}"
  strategy: ansible.builtin.free
  gather_facts: true
  become: true
  force_handlers: true

  vars:
    dynamic_inventory_group: "node4.example.com,node5.example.com,node6.example.com"
    leapp_release: "8.10"
    leapp_target_release: "8.10"
    leapp_unsupported: true
    LEAPP_UNSUPPORTED: "1"
    leapp_custom_flags: "--tailoring-file /etc/leapp/files/rhel7_to_rhel8_tailoring.xml"
    leapp_include_delay: false

  pre_tasks:
    - name: "PRE-UPGRADE: Ensure vdo package is present using generic package manager"
      ansible.builtin.package:
        name: vdo
        state: present

    - name: "PRE-UPGRADE: Answer Leapp confirmation dialogs in answerfile"
      ansible.builtin.command:
        cmd: "leapp answer --section {{ item }}=True"
      loop:
        - "remove_pam_pkcs11_module_check.confirm"
        - "check_vdo.confirm"
      changed_when: false
      failed_when: false

    - name: "PRE-UPGRADE: Clean stale Leapp scratch files and yum cache"
      ansible.builtin.shell: |
        rm -rf /var/lib/leapp/scratch/*
        yum clean all
      changed_when: false

  tasks:
    - name: Perform OS upgrade via infra.leapp.upgrade
      ansible.builtin.include_role:
        name: infra.leapp.upgrade
...
