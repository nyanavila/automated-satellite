---
- name: SCAP triage classify and route to correct pipeline
  hosts: localhost
  gather_facts: false
  vars:
    satellite_url: "https://satellite.v2wlb.sandbox5527.opentlc.com"
    satellite_user: "admin"
    satellite_password: "changeme"
    aap_url: "https://ansible-1.v2wlb.sandbox5527.opentlc.com"
    aap_token: "changeme"
    report_id: ""
    host_name: ""
    policy_name: "changeme"
    failed_count: 0
    passed_count: 0

  tasks:

    - name: Get latest ARF report if no report_id provided
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports?per_page=1&order=reported+DESC"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: latest_report
      when: report_id | string | length == 0

    - name: Set facts from latest report
      ansible.builtin.set_fact:
        report_id: "{{ latest_report.json.results[0].id }}"
        host_name: "{{ latest_report.json.results[0].host.name }}"
        policy_name: "{{ latest_report.json.results[0].policy.name }}"
        failed_count: "{{ latest_report.json.results[0].failed }}"
        passed_count: "{{ latest_report.json.results[0].passed }}"
      when:
        - report_id | string | length == 0
        - latest_report.json.results | length > 0

    - name: Pull specific ARF report metadata
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ report_id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: arf_report
      when: report_id | string | length > 0

    - name: Set facts from specific report
      ansible.builtin.set_fact:
        host_name: "{{ arf_report.json.host.name | default(host_name) }}"
        policy_name: "{{ arf_report.json.policy.name | default(policy_name) }}"
        failed_count: "{{ arf_report.json.failed | default(failed_count) }}"
        passed_count: "{{ arf_report.json.passed | default(passed_count) }}"
      when: arf_report is not skipped

    - name: Triage summary
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "SCAP Triage Report"
          - "Report ID:  {{ report_id }}"
          - "Host:       {{ host_name }}"
          - "Policy:     {{ policy_name }}"
          - "Passed:     {{ passed_count }}"
          - "Failed:     {{ failed_count }}"
          - "Action:     {{ 'REMEDIATE' if failed_count | int > 0 else 'ALL CLEAR' }}"
          - "========================================"

    - name: Launch oscap generate fix remediation on host
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/v2/job_templates/104/launch/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          limit: "{{ host_name }}"
          extra_vars:
            report_id: "{{ report_id }}"
            host_name: "{{ host_name }}"
            policy_name: "{{ policy_name }}"
            satellite_url: "{{ satellite_url }}"
            satellite_user: "{{ satellite_user }}"
            satellite_password: "{{ satellite_password }}"
            auto_rescan: true
        validate_certs: false
        status_code: [201]
      register: remediation_job
      when:
        - failed_count | int > 0
        - aap_token != "changeme"
      ignore_errors: true

    - name: Log if compliant
      ansible.builtin.debug:
        msg: "Host {{ host_name }} is compliant — no remediation needed"
      when: failed_count | int == 0

    - name: Log remediation dispatched
      ansible.builtin.debug:
        msg:
          - "Remediation job launched"
          - "AAP Job ID: {{ remediation_job.json.id | default('N/A') }}"
          - "Host: {{ host_name }}"
      when:
        - failed_count | int > 0
        - remediation_job is not skipped
        - remediation_job is not failed
