---
- name: Extract OpenSCAP ARF Compliance Data and Generate Remediation Matrix
  hosts: all
  gather_facts: true
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"

  tasks:
    - name: Query Satellite API for host compliance ARF reports
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports?search=host%3D%22{{ inventory_hostname }}%22&per_page=10&order=created_at%20DESC"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_search_raw

    - name: Fetch details for returned reports to find populated compliance data
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ item.id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      loop: "{{ arf_search_raw.json.results }}"
      register: arf_details_list

    - name: Select first report that has failed or passed rules
      ansible.builtin.set_fact:
        selected_arf_detail: >-
          {{
            (arf_details_list.results 
              | map(attribute='json') 
              | selectattr('failed_count', 'defined') 
              | selectattr('failed_count', 'greaterthan', 0) 
              | list 
              | first)
            | default(arf_details_list.results[0].json)
          }}

    - name: Extract compliance facts and failed rule snippets
      ansible.builtin.set_fact:
        latest_arf_id: "{{ selected_arf_detail.id }}"
        passed_rules_count: "{{ selected_arf_detail.passed_count | default(0) }}"
        failed_rules_count: "{{ selected_arf_detail.failed_count | default(0) }}"
        failed_rules: >-
          {{
            selected_arf_detail.rules
            | default([])
            | selectattr('result', 'defined')
            | selectattr('result', 'equalto', 'fail')
            | list
          }}

    - name: Check host reboot requirements (Kernel & Active Library Check)
      ansible.builtin.command: needs-restarting -r
      register: needs_restarting_check
      failed_when: false
      changed_when: false

    - name: Set host reboot status fact
      ansible.builtin.set_fact:
        reboot_needed: "{{ true if needs_restarting_check.rc == 1 else false }}"
        reboot_reason: >-
          {{
            'System requires a reboot due to updated kernel or core libraries.'
            if needs_restarting_check.rc == 1
            else 'System is running on latest booted kernel/libraries. No reboot required.'
          }}

    - name: Display Host Assessment Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "HOST:                     {{ inventory_hostname }} (RHEL {{ ansible_distribution_major_version }})"
          - "LATEST ARF REPORT ID:     {{ latest_arf_id }}"
          - "PASSED RULES:             {{ passed_rules_count }}"
          - "FAILED RULES:             {{ failed_rules_count }}"
          - "REBOOT REQUIRED:          {{ 'YES' if reboot_needed else 'NO' }}"
          - "REASON:                   {{ reboot_reason }}"
          - "=========================================================="

- name: Render Compliance Remediation Matrix Document
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"

  tasks:
    - name: Render Jinja2 Remediation Matrix Template
      ansible.builtin.template:
        src: templates/remediation_matrix.j2
        dest: /tmp/remediation_matrix.md
        mode: '0644'

    - name: Display Rendered Remediation Matrix in AAP Job Output
      ansible.builtin.debug:
        msg: "{{ lookup('file', '/tmp/remediation_matrix.md').split('\n') }}"
