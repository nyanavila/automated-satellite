---
- name: Parse Satellite ARF reports and generate remediation matrix
  hosts: all
  gather_facts: true
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"
    target_policy: >-
      {{
        'Freddie-CIS-BCS-Policy-RHEL9'
        if ansible_distribution_major_version == '9'
        else 'Freddie-CIS-BCS-Policy'
      }}
  tasks:

    - name: Query Satellite for latest ARF report
      ansible.builtin.uri:
        url: >-
          {{ satellite_url }}/api/compliance/arf_reports?search=host%3D%22{{ inventory_hostname }}%22+and+policy%3D%22{{ target_policy | urlencode }}%22+and+last_for%3Dhost&per_page=1&order=reported+DESC
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_search

    - name: Fail if no report found
      ansible.builtin.fail:
        msg: "No ARF report found for {{ inventory_hostname }}"
      when: arf_search.json.results | length == 0

    - name: Set ARF facts
      ansible.builtin.set_fact:
        latest_arf_id: "{{ arf_search.json.results[0].id }}"
        passed_rules_count: "{{ arf_search.json.results[0].passed | default(0) }}"
        failed_rules_count: "{{ arf_search.json.results[0].failed | default(0) }}"

    - name: Download ARF report bzip2
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ latest_arf_id }}/download"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        dest: "/tmp/arf_{{ latest_arf_id }}.xml.bz2"
        status_code: [200]
      delegate_to: localhost

    - name: Decompress ARF report
      ansible.builtin.command:
        cmd: "bunzip2 -f /tmp/arf_{{ latest_arf_id }}.xml.bz2"
      delegate_to: localhost
      changed_when: true

    - name: Parse ARF XML and extract failed rules with severity
      ansible.builtin.shell: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET
        import json

        tree = ET.parse('/tmp/arf_{{ inventory_hostname }}_{{ latest_arf_id }}.xml')
        root = tree.getroot()

        # XCCDF 1.2 namespace
        ns12 = 'http://checklists.nist.gov/xccdf/1.2'
        ns11 = 'http://checklists.nist.gov/xccdf/1.1'
        ns = ns12

        # Try both namespaces
        rule_results = root.findall('.//{%s}rule-result' % ns12)
        if not rule_results:
            rule_results = root.findall('.//{%s}rule-result' % ns11)
            ns = ns11

        # Build a map of rule-id -> definition (title, severity, fix)
        rule_defs = {}
        for rule in root.findall('.//{%s}Rule' % ns):
            rid = rule.get('id', '')
            severity = rule.get('severity', 'unknown')
            title_el = rule.find('{%s}title' % ns)
            title = title_el.text if title_el is not None else rid
            fixes = []
            for fix in rule.findall('{%s}fix' % ns):
                if fix.get('system', '') in [
                    'urn:xccdf:fix:script:ansible',
                    'urn:redhat:ansible:roles'
                ]:
                    fixes.append(fix.text or '')
            rule_defs[rid] = {
                'title': title,
                'severity': severity,
                'ansible_fix': '\n'.join(fixes)
            }

        failed = []
        for rr in rule_results:
            result_el = rr.find('{%s}result' % ns)
            if result_el is None or result_el.text.strip() != 'fail':
                continue
            rid = rr.get('idref', '')
            defn = rule_defs.get(rid, {})
            snippet = defn.get('ansible_fix', '')
            needs_reboot = any(kw in snippet for kw in ['reboot', 'kernel', 'grub', 'dracut']) \
                           and 'no_reboot_needed' not in snippet
            failed.append({
                'id': rid,
                'title': defn.get('title', rid),
                'severity': defn.get('severity', 'unknown'),
                'ansible_snippet': snippet,
                'needs_reboot': needs_reboot
            })

        # Sort high -> medium -> low
        order = {'high': 0, 'medium': 1, 'low': 2, 'unknown': 3}
        failed.sort(key=lambda r: order.get(r['severity'], 3))
        print(json.dumps(failed))
        PYEOF
      register: parsed_rules
      delegate_to: localhost
      changed_when: false

    - name: Set failed rules fact
      ansible.builtin.set_fact:
        failed_rules: "{{ parsed_rules.stdout | from_json }}"

    - name: Categorise by severity
      ansible.builtin.set_fact:
        high_rules:   "{{ failed_rules | selectattr('severity', 'equalto', 'high')   | list }}"
        medium_rules: "{{ failed_rules | selectattr('severity', 'equalto', 'medium') | list }}"
        low_rules:    "{{ failed_rules | selectattr('severity', 'equalto', 'low')    | list }}"
        reboot_rules: "{{ failed_rules | selectattr('needs_reboot', 'equalto', true) | list }}"

    - name: Check host reboot requirements
      ansible.builtin.command: needs-restarting -r
      register: needs_restarting_check
      failed_when: false
      changed_when: false

    - name: Set reboot status
      ansible.builtin.set_fact:
        reboot_needed: "{{ true if needs_restarting_check.rc == 1 else false }}"
        reboot_reason: >-
          {{
            'System requires a reboot — updated kernel or core libraries pending.'
            if needs_restarting_check.rc == 1
            else 'No reboot required.'
          }}

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "HOST:    {{ inventory_hostname }}"
          - "ARF ID:  {{ latest_arf_id }}"
          - "PASSED:  {{ passed_rules_count }}"
          - "FAILED:  {{ failed_rules_count }}"
          - "HIGH:    {{ high_rules | length }}"
          - "MEDIUM:  {{ medium_rules | length }}"
          - "LOW:     {{ low_rules | length }}"
          - "REBOOT (snippet):  {{ reboot_rules | length }} rules"
          - "REBOOT (system):   {{ 'YES' if reboot_needed else 'NO' }}"

    - name: Render remediation matrix
      ansible.builtin.template:
        src: templates/remediation_matrix.j2
        dest: "/tmp/remediation_matrix_{{ ansible_date_time.date }}.md"
        mode: '0644'
      delegate_to: localhost
      run_once: true

    - name: Display report
      ansible.builtin.debug:
        msg: "{{ lookup('file', '/tmp/remediation_matrix_' + ansible_date_time.date + '.md').split('\n') }}"
      delegate_to: localhost
          - name: Download ARF report bzip2
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ latest_arf_id }}/download"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        dest: "/tmp/arf_{{ inventory_hostname }}_{{ latest_arf_id }}.xml.bz2"
        status_code: [200]
      delegate_to: localhost

    - name: Decompress ARF report
      ansible.builtin.command:
        cmd: "bunzip2 -f /tmp/arf_{{ inventory_hostname }}_{{ latest_arf_id }}.xml.bz2"
      delegate_to: localhost
      changed_when: true
      run_once: true
