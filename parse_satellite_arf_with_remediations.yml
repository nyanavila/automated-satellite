---
- name: Extract OpenSCAP ARF Compliance Data and Generate Remediation Matrix
  hosts: all
  gather_facts: true
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"
    # Ensure satellite_user and satellite_password are defined (e.g. via AAP Credentials/Vault)

  tasks:
    - name: Query Satellite API for ARF reports with compliance data
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/v2/hosts/{{ inventory_hostname }}/arf_reports?search=failed%3E0%20or%20passed%3E0"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_summary_raw

    - name: Fallback query if no non-zero reports found
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/v2/hosts/{{ inventory_hostname }}/arf_reports"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_summary_fallback
      when: arf_summary_raw.json.results | length == 0

    - name: Determine target ARF Report ID
      ansible.builtin.set_fact:
        target_arf_id: >-
          {{
            (arf_summary_raw.json.results[0].id)
            if (arf_summary_raw.json.results | length > 0)
            else (arf_summary_fallback.json.results[0].id)
          }}

    - name: Fetch detailed OpenSCAP ARF report from Satellite
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/v2/compliance/arf_reports/{{ target_arf_id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_detail_raw

    - name: Extract compliance facts and failed rule snippets
      ansible.builtin.set_fact:
        latest_arf_id: "{{ target_arf_id }}"
        passed_rules_count: "{{ arf_detail_raw.json.passed_count | default(0) }}"
        failed_rules_count: "{{ arf_detail_raw.json.failed_count | default(0) }}"
        failed_rules: >-
          {{
            arf_detail_raw.json.rules
            | default([])
            | selectattr('result', 'defined')
            | selectattr('result', 'equalto', 'fail')
            | list
          }}

    - name: Check host reboot requirements (Kernel & Active Library Check)
      ansible.builtin.command: needs-restarting -r
      register: needs_restarting_check
      failed_when: false
      changed_when: false

    - name: Set host reboot status fact
      ansible.builtin.set_fact:
        reboot_needed: "{{ true if needs_restarting_check.rc == 1 else false }}"
        reboot_reason: >-
          {{
            'System requires a reboot due to updated kernel or core libraries.'
            if needs_restarting_check.rc == 1
            else 'System is running on latest booted kernel/libraries. No reboot required.'
          }}

    - name: Display Host Assessment Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "HOST:                     {{ inventory_hostname }} (RHEL {{ ansible_distribution_major_version }})"
          - "LATEST ARF REPORT ID:     {{ latest_arf_id }}"
          - "PASSED RULES:             {{ passed_rules_count }}"
          - "FAILED RULES:             {{ failed_rules_count }}"
          - "REBOOT REQUIRED:          {{ 'YES' if reboot_needed else 'NO' }}"
          - "REASON:                   {{ reboot_reason }}"
          - "=========================================================="

- name: Render Compliance Remediation Matrix Document
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"

  tasks:
    - name: Render Jinja2 Remediation Matrix Template
      ansible.builtin.template:
        src: templates/remediation_matrix.j2
        dest: /tmp/remediation_matrix.md
        mode: '0644'

    - name: Display Rendered Remediation Matrix in AAP Job Output
      ansible.builtin.debug:
        msg: "{{ lookup('file', '/tmp/remediation_matrix.md').split('\n') }}"
