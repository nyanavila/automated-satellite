---
- name: Extract OpenSCAP ARF Compliance Data and Generate Remediation Matrix
  hosts: all
  gather_facts: true
  vars:
    satellite_url: "https://satellite.2hzls.sandbox223.opentlc.com"
    target_policy: "Freddie-CIS-BCS-Policy-RHEL9"

  tasks:
    - name: Query Satellite API for host's latest ARF report for target policy
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports?search=host%3D%22{{ inventory_hostname }}%22&per_page=50&order=reported+DESC"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: arf_search

    - name: Select latest ARF report matching target policy
      ansible.builtin.set_fact:
        target_arf: >-
          {{
            arf_search.json.results
            | selectattr('policy', 'defined')
            | selectattr('policy.name', 'equalto', target_policy)
            | list
            | first
            | default({})
          }}

    - name: Fail if no ARF report found for target policy
      ansible.builtin.fail:
        msg: "No ARF report found for {{ inventory_hostname }} with policy {{ target_policy }}"
      when: target_arf == {}

    - name: Set target ARF ID
      ansible.builtin.set_fact:
        target_arf_id: "{{ target_arf.id }}"
        passed_rules_count: "{{ target_arf.passed | default(0) }}"
        failed_rules_count: "{{ target_arf.failed | default(0) }}"

    - name: Download XCCDF ARF report XML for rule-level detail
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ target_arf_id }}/download_html"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: [200]
      register: arf_html
      ignore_errors: true

    - name: Fetch rule-level data from compliance rules endpoint
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/arf_reports/{{ target_arf_id }}/rules?per_page=250&search=result%3Dfail"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: arf_rules_raw
      ignore_errors: true

    - name: Debug rules API response
      ansible.builtin.debug:
        msg:
          - "ARF ID: {{ target_arf_id }}"
          - "Rules endpoint status: {{ arf_rules_raw.status }}"
          - "Rules count returned: {{ arf_rules_raw.json.results | default([]) | length }}"
          - "First rule sample: {{ arf_rules_raw.json.results[0] | default('NONE') }}"
      when: arf_rules_raw is defined

    - name: Build failed rules list with severity from rules endpoint
      ansible.builtin.set_fact:
        failed_rules: >-
          {{
            arf_rules_raw.json.results
            | default([])
            | selectattr('result', 'defined')
            | selectattr('result', 'equalto', 'fail')
            | list
          }}
      when:
        - arf_rules_raw.status == 200
        - arf_rules_raw.json.results | default([]) | length > 0

    - name: Set empty failed rules if endpoint unavailable
      ansible.builtin.set_fact:
        failed_rules: []
      when: >
        arf_rules_raw is not defined or
        arf_rules_raw.status != 200 or
        arf_rules_raw.json.results | default([]) | length == 0

    - name: Categorise failed rules by severity
      ansible.builtin.set_fact:
        high_rules: "{{ failed_rules | selectattr('severity', 'defined') | selectattr('severity', 'equalto', 'high') | list }}"
        medium_rules: "{{ failed_rules | selectattr('severity', 'defined') | selectattr('severity', 'equalto', 'medium') | list }}"
        low_rules: "{{ failed_rules | selectattr('severity', 'defined') | selectattr('severity', 'equalto', 'low') | list }}"

    - name: Check host reboot requirements
      ansible.builtin.command: needs-restarting -r
      register: needs_restarting_check
      failed_when: false
      changed_when: false

    - name: Set host reboot status fact
      ansible.builtin.set_fact:
        reboot_needed: "{{ true if needs_restarting_check.rc == 1 else false }}"
        reboot_reason: >-
          {{
            'System requires a reboot due to updated kernel or core libraries.'
            if needs_restarting_check.rc == 1
            else 'No reboot required.'
          }}

    - name: Display Host Assessment Summary
      ansible.builtin.debug:
        msg:
          - "HOST:      {{ inventory_hostname }} (RHEL {{ ansible_distribution_major_version }})"
          - "ARF ID:    {{ target_arf_id }}"
          - "POLICY:    {{ target_policy }}"
          - "PASSED:    {{ passed_rules_count }}"
          - "FAILED:    {{ failed_rules_count }}"
          - "HIGH:      {{ high_rules | length }}"
          - "MEDIUM:    {{ medium_rules | length }}"
          - "LOW:       {{ low_rules | length }}"
          - "REBOOT:    {{ 'YES' if reboot_needed else 'NO' }}"

    - name: Render Jinja2 Remediation Matrix Template
      ansible.builtin.template:
        src: templates/remediation_matrix.j2
        dest: /tmp/remediation_matrix.md
        mode: '0644'
      delegate_to: localhost
      run_once: true

    - name: Display Rendered Remediation Matrix
      ansible.builtin.debug:
        msg: "{{ lookup('file', '/tmp/remediation_matrix.md').split('\n') }}"
      delegate_to: localhost
      run_once: true
