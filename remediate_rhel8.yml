---
- name: Wait for connection...
  ansible.builtin.wait_for_connection:
    connect_timeout: 20
    sleep: 5
    delay: 5
    timeout: 300

- name: Configure firewalld
  ansible.builtin.lineinfile:
    path: "/etc/firewalld/firewalld.conf"
    regexp: "^(#)?{{ item.key }}"
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "AllowZoneDrifting", value: "no" }
  notify:
    - Restart firewalld

- name: Check and answer VDO Leapp question if present
  ansible.builtin.command: leapp answer --section check_vdo.confirm=True
  register: vdo_answer
  changed_when: vdo_answer.rc == 0
  failed_when: false

- name: Configure sshd to clear RHEL 9 Leapp inhibitors
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: "^(#)?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
  loop:
    - { key: "PermitRootLogin", value: "prohibit-password" }
  notify:
    - Restart sshd

# Fix Inhibitor 1: Update OS packages from 8.8 to 8.10
- name: Update all system packages to RHEL 8.10
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_distribution_version is version('8.10', '<')

- name: Reboot node to apply 8.10 kernel
  ansible.builtin.reboot:
    reboot_timeout: 3600
  when: ansible_distribution_version is version('8.10', '<')

# Fix Inhibitor 2: Allow RHEL 9.2 target version
- name: Set LEAPP_UNSUPPORTED environment variable
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "LEAPP_UNSUPPORTED=1"
    state: present

- name: Clean package manager metadata
  ansible.builtin.command: dnf clean all
  changed_when: true

- name: Delete yum cache directories
  ansible.builtin.file:
    path: /var/cache/yum
    state: absent
...
