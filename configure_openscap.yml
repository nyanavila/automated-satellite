---
- hosts: "{{ dynamic_inventory_group | default(omit) }}"
  become: true
  strategy: free
  gather_facts: true
  vars:
    policy_name: all
  pre_tasks:
    - name: Ensure proper version of rubygem-foreman_scap_client version to 0.5.1-1.1.el7sat
      when:
        - ansible_distribution == 'RedHat'
        - ansible_distribution_major_version == '7'
      ansible.builtin.yum:
        name: rubygem-foreman_scap_client-0.5.1-1.1.el7sat
        state: present
        allow_downgrade: true

    - name: Enable Satellite client repo on RHEL 8
      ansible.builtin.command: >
        subscription-manager repos
        --enable="satellite-client-6-for-rhel-8-x86_64-rpms"
      when:
        - ansible_distribution == 'RedHat'
        - ansible_distribution_major_version == '8'
      ignore_errors: true

    - name: Install rubygem-foreman_scap_client on RHEL 8
      when:
        - ansible_distribution == 'RedHat'
        - ansible_distribution_major_version == '8'
      ansible.builtin.yum:
        name:
          - rubygem-foreman_scap_client
          - openscap-scanner
          - scap-security-guide
        state: present

    - name: Ensure proper version of rubygem-foreman_scap_client version to 0.5.1-1.el7_9
      when: ansible_distribution == 'CentOS'
      ansible.builtin.yum:
        name: rubygem-foreman_scap_client-0.5.1-1.el7_9
        state: present
        allow_downgrade: true
  roles:
    - scap_client
  tasks:
    - name: Randomized startup delay...
      ansible.builtin.command: |
        python3 -c 'import time;import random;zzzzz=random.uniform(10.0,30.0);time.sleep(zzzzz);print(zzzzz)'
      delegate_to: localhost
      connection: local
    - name: "Run SCAP Scan"
      ansible.builtin.shell: "/usr/bin/foreman_scap_client {{ item.id }}"
      loop: "{{ policy }}"
      when: policy_scan == 'all' or item.name in policy_scan
...
